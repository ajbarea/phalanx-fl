# Docker Compose Configuration
# Usage:
#   docker compose up              # Development (with monitoring, hot reload)
#   docker compose -f docker-compose.yml up -d  # Production only (no monitoring, no overrides)
#   docker compose run --rm api python -m intellifl.simulation_runner <config.json>

services:
  api:
    image: intellifl-api:latest
    build: .
    pull_policy: always
    container_name: intellifl-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"

    # Shared memory for PyTorch DataLoader workers
    shm_size: '4gb'

    volumes:
      - ./out:/app/out                    # Simulation outputs (persistent)
      - ./datasets:/app/datasets          # Datasets (auto-downloaded on first run)
      - ./config:/app/config:ro           # Configs (read-only)

    environment:
      PYTHONUNBUFFERED: 1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/1

    # GPU support (ignored on CPU-only machines)
    deploy:
      resources:
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # First run downloads datasets

  frontend:
    image: intellifl-web:latest
    build: ./frontend
    pull_policy: always
    container_name: intellifl-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    deploy:
      resources:
        limits:
          memory: 512M

  docs:
    image: squidfunk/mkdocs-material
    container_name: intellifl-docs
    restart: unless-stopped
    command: serve --dev-addr=0.0.0.0:8000
    ports:
      - "${DOCS_PORT:-8080}:8000"
    volumes:
      - ./docs:/docs/docs
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
    working_dir: /docs
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================================
  # Celery Task Queue Infrastructure
  # ============================================================================

  redis:
    image: redis:7-alpine
    container_name: intellifl-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery-worker:
    image: intellifl-api:latest
    container_name: intellifl-worker
    restart: unless-stopped
    command: celery -A intellifl.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
    shm_size: '8gb'
    volumes:
      - ./out:/app/out
      - ./datasets:/app/datasets
    environment:
      PYTHONUNBUFFERED: 1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "celery -A intellifl.celery_app inspect ping -d celery@$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  redis-data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Usage:
#   docker compose up --build        # Build and run
#   docker compose up -d             # Run in background
#   docker compose down              # Stop
#   docker compose run --rm api python -m intellifl.simulation_runner <config.json>

services:
  api:
    image: intellifl-api:latest
    build: .
    container_name: intellifl-api
    ports:
      - "${API_PORT:-8000}:8000"

    # Shared memory for PyTorch DataLoader workers
    shm_size: '4gb'

    # Mount data at runtime (best practice for reproducibility)
    volumes:
      - ./out:/app/out                    # Simulation outputs (persistent)
      - ./datasets:/app/datasets          # Datasets (auto-downloaded on first run)
      - ./config:/app/config:ro           # Configs (read-only)

    environment:
      - PYTHONUNBUFFERED=1

    # GPU support (ignored on CPU-only machines)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # First run downloads datasets

  frontend:
    image: intellifl-web:latest
    build: ./frontend
    container_name: intellifl-web
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

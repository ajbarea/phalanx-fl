[project]
name = "phalanx-fl"
version = "0.1.0"
description = "Federated learning on the latest Flower (flwr) app-model — an OTel-observable FL research testbed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AJ Barea" }]
requires-python = ">=3.12,<3.15"
keywords = [
    "federated-learning",
    "flower",
    "flwr",
    "huggingface",
    "lora",
    "opentelemetry",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "flwr[simulation]>=1.39",
    "flwr-datasets>=0.6",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "numpy>=2",
]

[project.optional-dependencies]
# Model + data stack. Torch wheel per platform: see [tool.uv.sources].
hf = [
    "transformers>=5.10",
    "peft>=0.10",
    # flwr-datasets 0.6.0 caps datasets <5; transformers 5 only needs >=2.15.
    "datasets>=2.15,<5",
]
torch = [
    "torch>=2.12",
    "torchvision>=0.15",
]
# Figures for experiments/ reports.
experiments = ["matplotlib>=3.10"]
all = ["phalanx-fl[hf,torch,experiments]"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.150",
    "pip-audit",
    "actionlint-py>=1.7.12",
    "ruff>=0.16.8",
    "ty>=0.0.82,<0.1",
    "zensical>=0.0.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phalanx"]

# =============================================================================
# Flower app (flwr 1.39 app-model: ServerApp / ClientApp / task)
# =============================================================================
[tool.flwr.app]
publisher = "ajbarea"
flwr-version-target = "1.39.0"

[tool.flwr.app.components]
serverapp = "phalanx.server_app:app"
clientapp = "phalanx.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
# Google's original tiny BERT (2-layer/128-hidden, ~4.4M params). Ships a complete
# config.json with `model_type` — required by transformers >=5 (the older
# prajjwal1/bert-tiny re-upload omits it and fails to load on transformers 5).
model-name = "google/bert_uncased_L-2_H-128_A-2"
dataset = "stanfordnlp/imdb"
text-column = "text"
num-labels = 2
# LoRA layers, comma-separated; "" = PEFT default for the architecture.
lora-target-modules = ""
seed = 0
# Non-IID partitioning over the HF dataset; lower alpha = more label skew.
partitioner = "dirichlet"
dirichlet-alpha = 0.5
local-epochs = 1
learning-rate = 5e-5
fraction-train = 0.1
fraction-evaluate = 0.1
# Global test set: the dataset's `test` split, scored server-side on the aggregated
# adapters each round. A positive size takes a seeded sample of that many rows; 0 = all.
global-eval-size = 0
otel-service-name = "phalanx-fl"
# Aggregation rule: fedavg | krum | multikrum | trimmed-mean | median | bulyan.
strategy = "fedavg"
num-malicious = 0          # f, for krum / multikrum / bulyan
num-nodes-to-select = 1    # multikrum only
trim-beta = 0.2            # trimmed-mean only
# Poisoning: comma-separated partition ids; "" = everyone honest.
malicious-partitions = ""
attack = "none"            # none | label-flip
flip-from = 0
flip-to = 1
boost = 1.0                # attacker scales its update by this before replying
attack-start-round = 1
# OTLP endpoint is read from the OTEL_EXPORTER_OTLP_ENDPOINT env var when set.

# Federation settings live outside this file: a [tool.flwr.federations] block is
# migrated out on the first `flwr run`, rewriting this file (flwr #6824). The
# Makefile passes the federation per run instead.

# =============================================================================
# uv — torch: CUDA 13.0 on Linux aarch64 (GH200), CPU wheels everywhere else.
# =============================================================================
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
]

# =============================================================================
# Tooling (carried from the sister conventions)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["phalanx", "tests"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "torch",
    "torch.**",
    "torchvision",
    "torchvision.**",
    "transformers",
    "transformers.**",
    "datasets",
    "datasets.**",
    "peft",
    "peft.**",
    "flwr.**",
    "flwr_datasets.**",
    "opentelemetry.**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["phalanx"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

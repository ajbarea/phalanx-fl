[project]
name = "intellifl"
version = "0.1.0"
description = "Federated Learning Framework with Ray, Flower, and PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AJ Barea" }]
requires-python = ">=3.12,<3.14"
keywords = [
    "federated-learning",
    "byzantine-robustness",
    "attack-simulation",
    "machine-learning",
    "pytorch",
    "flower",
    "ray",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "celery[redis]",
    "datasets",
    "fastapi",
    "flwr>=1.28",
    "flwr-datasets",
    "jsonschema",
    "matplotlib",
    "numpy",
    "pandas",
    "peft",
    "psutil",
    "pydantic",
    "pywinpty; sys_platform == 'win32'",
    "python-dotenv",
    "pyyaml",
    "rich",
    "scikit-learn",
    "scipy",
    "sse-starlette",
    "torch",
    "torchvision",
    "tqdm",
    "transformers>=5.9.0",
    "uvicorn[standard]",
    "ray>=2.54.1",
]

[project.urls]
Homepage = "https://github.com/ajbarea/phalanx-fl"
Repository = "https://github.com/ajbarea/phalanx-fl"

[dependency-groups]
dev = [
    "hypothesis",
    "testcontainers[redis]",
    "pip-audit",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0.0",
    "pytest-mock",
    "pytest-randomly",
    "pytest-repeat",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.15",
    "ty>=0.0.42,<0.1",
    "zensical",
]

[project.scripts]
intellifl-dev = "intellifl.dev_cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["intellifl*", "scripts*", "tests*"]



# =============================================================================
# Ty Configuration
# =============================================================================
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["intellifl", "scripts", "tests"]
exclude = [
    "__pycache__",
    ".venv*",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
    "out",
    "datasets",
    "cache",
    "frontend",
    "intellifl/attack_utils/vocabularies",
]

[tool.ty.rules]
all = "warn"
unresolved-import = "error"
division-by-zero = "ignore"

[tool.ty.analysis]
replace-imports-with-any = [
    "hypothesis.**",
    "pytest.**",
    "_pytest.**",
    "uvicorn.**",
    "ray.**",
    "flwr.**",
    "torch.**",
    "pandas.**",
    "numpy.**",
    "matplotlib.**",
    "cv2.**",
    "transformers.**",
    "datasets.**",
    "celery.**",
    "peft.**",
]

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unknown-argument = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
call-non-callable = "ignore"
no-matching-overload = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv*",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
    "out",
    "datasets",
    "cache",
    "frontend",
    ".git",
    "intellifl/attack_utils/vocabularies",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "B008",
    "B904",
    "B007",
    "B023",
    "SIM102",
    "SIM108",
    "SIM113",
    "SIM115",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"intellifl/api/main.py" = ["E402"]
"intellifl/simulation_runner.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--log-file=tests/logs/pytest.log",
    "--log-file-level=DEBUG",
    "--log-level=INFO",
    "-W", "error::DeprecationWarning",
    "-W", "ignore::RuntimeWarning:numpy",
    "-p", "randomly",
    # Default to a fresh random seed each session. Pytest-randomly's
    # xdist hook propagates that seed to every worker at controller
    # startup, so all workers shuffle identically and xdist's
    # "Different tests were collected between gw0 and gw1" collection
    # mismatch can't trigger.
    #
    # Previously `--randomly-seed=last` lived here for local
    # reproducibility, but on fresh CI runs (no .randomly-seed-cache
    # file) each worker resolved "last" independently → diverging
    # seeds → collection mismatch. Surface flake hit phalanx-fl PR #17
    # on Python 3.13 (2026-05-22). To reproduce a specific session
    # locally, copy the printed seed and run: `pytest --randomly-seed=N`.
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "slow: Slow running tests",
    "tutorial: Tutorial tests (no coverage requirement)",
    "parallel: Tests safe for parallel execution",
    "serial: Tests that must run in isolation",
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::RuntimeWarning:numpy.*",
    "ignore::RuntimeWarning:threadpoolctl.*",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# Flower Federated Learning Configuration
# =============================================================================
[tool.flwr.app]
publisher = "intellifl"

[tool.flwr.app.config]
num-server-rounds = 10
num-clients = 5
dataset = "femnist_iid"
aggregation-strategy = "fedavg"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.0

# =============================================================================
# uv Configuration
# =============================================================================
[tool.uv]
required-version = ">=0.5.3"
python-preference = "managed"

environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]


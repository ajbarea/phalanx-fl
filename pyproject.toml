[project]
name = "fl-execution-framework"
version = "0.1.0"
requires-python = ">=3.9,<3.12"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "src/attack_utils/vocabularies",
    "venv",
    ".venv",
    "__pycache__",
    "frontend",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # Line too long - handled by formatter
    "B008",  # Function call in default argument
    "B904",  # raise from in except - intentional for HTTP exceptions
    "B007",  # Loop variable not used - common in tests
    "B023",  # Lambda doesn't bind loop variable - test patterns
    "SIM102",  # Nested if statements - sometimes more readable
    "SIM108",  # Use ternary operator - sometimes less readable
    "SIM113",  # Use enumerate - not always clearer
    "SIM115",  # Context manager for files - handled by class __exit__
    "SIM117",  # Nested with statements - sometimes more readable
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# isort Configuration
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
skip = [
    "src/attack_utils/vocabularies",
    "venv",
    ".venv",
]
known_first_party = ["src"]

# =============================================================================
# mypy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
show_error_codes = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "normal"

# Real type checking - NOT ignored
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Warnings
warn_redundant_casts = true
warn_unused_ignores = false

# Files to check
files = ["src", "tests"]

# Global exclusions
exclude = [
    "src/attack_utils/vocabularies",
    "src/utils/legacy",
    "venv",
    ".venv",
    "frontend",
]

# Per-module overrides for stricter checking on cleaned modules
[[tool.mypy.overrides]]
module = "src.data_models.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "src.config_loaders.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# =============================================================================
# Mutation Testing (mutmut) Configuration
# =============================================================================
[tool.mutmut]
paths_to_mutate = ["src/simulation_strategies/", "src/attack_utils/"]
tests_dir = "tests/"
runner = "python -m pytest"
pytest_add_cli_args_test_selection = ["-m", "not slow", "-x", "-q"]

[project]
name = "fl-execution-framework"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate",
    "click",
    "datasets",
    "dill",
    "fastapi",
    "flwr",
    "flwr-datasets",
    "fsspec",
    "httpx",
    "matplotlib",
    "multiprocess",
    "numpy>=1.26.4,<3.0",
    "opencv-python-headless",
    "pandas",
    "peft",
    "psutil",
    "pyarrow",
    "pyyaml>=6.0.2,<7.0.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "ray",
    "requests",
    "rich",
    "scikit-learn",
    "scipy>=1.13.1,<2.0",
    "sse-starlette",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm",
    "transformers",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    # Virtual environments
    "venv",
    ".venv",
    # Cache directories
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
    # Build/output directories
    "out",
    "datasets",
    "cache",
    # Other projects
    "frontend",
    ".git",
    # Project-specific
    "src/attack_utils/vocabularies",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # Line too long - handled by formatter
    "B008",  # Function call in default argument
    "B904",  # raise from in except - intentional for HTTP exceptions
    "B007",  # Loop variable not used - common in tests
    "B023",  # Lambda doesn't bind loop variable - test patterns
    "SIM102",  # Nested if statements - sometimes more readable
    "SIM108",  # Use ternary operator - sometimes less readable
    "SIM113",  # Use enumerate - not always clearer
    "SIM115",  # Context manager for files - handled by class __exit__
    "SIM117",  # Nested with statements - sometimes more readable
]

[tool.ruff.lint.per-file-ignores]
"src/api/main.py" = ["E402"]
"src/simulation_runner.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# isort Configuration
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
skip = [
    "venv",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
    "out",
    "datasets",
    "cache",
    "frontend",
    "src/attack_utils/vocabularies",
]
known_first_party = ["src"]

# =============================================================================
# mypy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
show_error_codes = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "normal"

# Type checking
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Warnings
warn_redundant_casts = true
warn_unused_ignores = false

# Files to check
files = ["src", "tests"]

# Global exclusions
exclude = [
    "venv",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".hypothesis",
    "out",
    "datasets",
    "cache",
    "frontend",
    "src/attack_utils/vocabularies",
    "src/utils/legacy",
]

[[tool.mypy.overrides]]
module = "transformers.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "peft.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "src.data_models.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "src.config_loaders.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# =============================================================================
# Mutation Testing (mutmut) Configuration
# =============================================================================
[tool.mutmut]
paths_to_mutate = ["src/simulation_strategies/", "src/attack_utils/"]
tests_dir = "tests/"
runner = "python -m pytest"
pytest_add_cli_args_test_selection = ["-m", "not slow", "-x", "-q"]

# =============================================================================
# Flower Federated Learning Configuration (flwr 1.25+)
# =============================================================================
# This section enables `flwr run` CLI usage as an alternative to the
# programmatic run_simulation() API. Both approaches are fully supported.
#
# Usage:
#   flwr run .                           # Run default federation
#   flwr run . local-simulation-gpu      # Run GPU-enabled federation
#
# Reference: https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html

[tool.flwr.app]
publisher = "intellifl"

[tool.flwr.app.config]
# Default simulation parameters (overridable via --run-config)
num-server-rounds = 10
num-clients = 5
dataset = "femnist_iid"
aggregation-strategy = "fedavg"

[tool.flwr.federations]
default = "local-simulation"

# CPU-only local simulation (default)
[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.0

# GPU-enabled local simulation (4 clients per GPU)
[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.25

# High-performance GPU simulation (2 clients per GPU)
[tool.flwr.federations.local-simulation-gpu-hp]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 4
options.backend.client-resources.num-gpus = 0.5
options.backend.init_args.num_cpus = 8
options.backend.init_args.num_gpus = 1

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--log-file=tests/logs/pytest.log",
    "--log-level=INFO",
    "-W", "error::DeprecationWarning",
    "-W", "ignore::RuntimeWarning:numpy",
    "-p", "randomly",
    "--randomly-seed=last",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "slow: Slow running tests",
    "tutorial: Tutorial tests (no coverage requirement)",
    "parallel: Tests safe for parallel execution",
    "serial: Tests that must run in isolation",
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::RuntimeWarning:numpy.*",
    "ignore::RuntimeWarning:threadpoolctl.*",
    "ignore::PendingDeprecationWarning",
]

[dependency-groups]
dev = [
    "hypothesis>=6.141.1",
    "isort>=6.1.0",
    "mutmut>=3.3.1",
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-repeat>=0.9.3",
    "pytest-randomly>=3.17.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.11",
]

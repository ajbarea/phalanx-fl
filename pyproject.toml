[project]
name = "phalanx-fl"
version = "0.1.0"
description = "Federated learning on the latest Flower (flwr) app-model — an OTel-observable FL research testbed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AJ Barea" }]
requires-python = ">=3.12,<3.14"
keywords = [
    "federated-learning",
    "flower",
    "flwr",
    "huggingface",
    "lora",
    "opentelemetry",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "flwr[simulation]>=1.31",
    "flwr-datasets>=0.6",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "numpy>=2",
]

[project.optional-dependencies]
# Model + data stack. Torch is CPU-only by default (see [tool.uv.sources]); GPU is opt-in.
hf = [
    "transformers>=5.10",
    "peft>=0.10",
    # flwr-datasets 0.6.0 caps datasets <5; transformers 5 only needs >=2.15.
    "datasets>=2.15,<5",
    "evaluate>=0.4",
    "scikit-learn>=1.3",
]
torch = [
    "torch>=2.12",
    "torchvision>=0.15",
]
all = ["phalanx-fl[hf,torch]"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.150",
    "pip-audit",
    "ruff>=0.15.16",
    "ty>=0.0.44,<0.1",
    "zensical",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phalanx"]

# =============================================================================
# Flower app (flwr 1.31 app-model: ServerApp / ClientApp / task)
# =============================================================================
[tool.flwr.app]
publisher = "ajbarea"
flwr-version-target = "1.31.0"

[tool.flwr.app.components]
serverapp = "phalanx.server_app:app"
clientapp = "phalanx.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
# Google's original tiny BERT (2-layer/128-hidden, ~4.4M params). Ships a complete
# config.json with `model_type` — required by transformers >=5 (the older
# prajjwal1/bert-tiny re-upload omits it and fails to load on transformers 5).
model-name = "google/bert_uncased_L-2_H-128_A-2"
dataset = "stanfordnlp/imdb"
num-labels = 2
# Non-IID partitioning over the HF dataset; lower alpha = more label skew.
partitioner = "dirichlet"
dirichlet-alpha = 0.5
local-epochs = 1
fraction-train = 0.1
fraction-evaluate = 0.1
otel-service-name = "phalanx-fl"
# OTLP endpoint is read from the OTEL_EXPORTER_OTLP_ENDPOINT env var when set.

# =============================================================================
# Local simulation federation. flwr 1.31 migrates this into ~/.flwr/config.toml
# on the first `flwr run`, then comments this block out *locally* (see flwr
# #6824). It is kept here un-commented so a fresh clone bootstraps a working
# `local-simulation`; override per run with `--federation-config`, e.g.
# `flwr run . local-simulation --federation-config 'options.num-supernodes=10'`.
# =============================================================================
[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.0

# =============================================================================
# uv — torch CPU-only by default (mirrors velocity-fl): avoids ~2 GB of CUDA
# wheels on CPU dev/CI. GPU is opt-in: swap the index below to cu128 and re-sync.
# =============================================================================
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# GPU (opt-in): comment out the cpu sources below, uncomment this index + the
# cu128 sources, then `uv sync --extra hf --extra torch`.
# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
# GPU: torch = [{ index = "pytorch-cu128" }]
# GPU: torchvision = [{ index = "pytorch-cu128" }]

# =============================================================================
# Tooling (carried from the sister conventions)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["phalanx", "tests"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "torch",
    "torch.**",
    "torchvision",
    "torchvision.**",
    "transformers",
    "transformers.**",
    "datasets",
    "datasets.**",
    "peft",
    "peft.**",
    "evaluate",
    "evaluate.**",
    "flwr.**",
    "flwr_datasets.**",
    "opentelemetry.**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["phalanx"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

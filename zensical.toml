[project]
site_name = "Phalanx-FL"
site_description = "Federated learning on the latest Flower, with OpenTelemetry-native observability"
site_author = "AJ Barea"
site_url = "https://ajbarea.github.io/phalanx-fl/"
repo_url = "https://github.com/ajbarea/phalanx-fl"
repo_name = "ajbarea/phalanx-fl"
copyright = "AJ Barea"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Architecture" = "architecture.md" },
  { "Research" = [
      { "Overview" = "research/index.md" },
      { "RIT Capstone 2025: IntelliFL" = "research/rit-capstone-2025-intellifl/index.md" },
  ]},
]

extra_css = ["stylesheets/extra.css", "stylesheets/figures.css"]
extra_javascript = ["javascripts/reveal.js"]

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
name = "material"
language = "en"
custom_dir = "overrides"

features = [
    # Announcement bar
    "announce.dismiss",

    # Code blocks
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",

    # Content features
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",

    # Navigation
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",

    # Search
    "search.highlight",
    "search.suggest",
]

# ---------------------------------------------------------------------------
# Color palette — light/dark toggle
# ---------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep-purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep-purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# ---------------------------------------------------------------------------
# Icon
# ---------------------------------------------------------------------------
[project.theme.icon]
logo = "material/scatter-plot"

# ---------------------------------------------------------------------------
# Social links (footer)
# ---------------------------------------------------------------------------
[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ajbarea/phalanx-fl"
name = "Phalanx-FL on GitHub"

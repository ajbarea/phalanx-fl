name: CI Pipeline
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.9.26
          enable-cache: true
      - name: Verify lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen
      - name: Audit for security vulnerabilities
        run: uv run intellifl-dev audit
      - name: Upload audit logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-logs
          path: |
            logs/backend-audit.log
            logs/frontend-audit.log
          if-no-files-found: ignore
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
  test:
    name: 'Test (Python ${{ matrix.python-version }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.12'
          - '3.13'
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.9.26
          enable-cache: true
          cache-suffix: 'py${{ matrix.python-version }}'
      - name: Install dependencies
        run: 'uv sync --frozen --python ${{ matrix.python-version }}'
      - name: Run unit tests (parallel)
        run: >
          uv run pytest -n auto --cov=intellifl --cov-append --cov-report=
          tests/unit/ --tb=short
      - name: Run integration tests (serial)
        run: >
          uv run pytest --cov=intellifl --cov-append --cov-report=
          tests/integration/ --tb=short
      - name: Run performance tests (serial)
        run: >
          uv run pytest --cov=intellifl --cov-append --cov-report=
          tests/performance/ --tb=short
      - name: Generate final coverage report
        run: |
          uv run coverage report --show-missing
          uv run coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        if: matrix.python-version == '3.12'
        with:
          token: '${{ secrets.CODECOV_TOKEN }}'
          slug: ajbarea/phalanx-fl
          files: tests/logs/coverage.xml
          fail_ci_if_error: false
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.9.26
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Smoke check developer CLI
        run: uv run intellifl-dev help
      - name: Run smoke tests
        run: |
          uv run python -m tests.scripts.ci_smoke_test
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

name: CI Pipeline
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: 0.11.5
          enable-cache: true
      - name: Verify lockfile is in sync with pyproject.toml
        run: uv lock --check
      # ty resolves torch/transformers via allowed-unresolved-imports, so lint
      # needs no model stack — keep it fast with the dev group only.
      - name: Install dev dependencies
        run: uv sync --frozen
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: ty type-check
        run: uv run ty check
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: 'Test (Python ${{ matrix.python-version }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.12'
          - '3.13'
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: 0.11.5
          enable-cache: true
          cache-suffix: 'py${{ matrix.python-version }}'
      # No --frozen: torch comes from the explicit pytorch-cpu index, whose wheels
      # aren't pinned in the lock, so --frozen can't fetch the per-Python wheel
      # (e.g. cp313). Lock/pyproject consistency is already gated by the lint job's
      # `uv lock --check`. Mirrors the velocity-fl convention.
      - name: Install dependencies (CPU torch + HF stack)
        run: 'uv sync --extra hf --extra torch --python ${{ matrix.python-version }}'
      # The extras must be on `uv run` too: without them it re-syncs to the default
      # groups and drops torch before pytest collects. Mirrors the Makefile.
      - name: Run tests with coverage
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: >
          uv run --extra hf --extra torch --python ${{ matrix.python-version }}
          python -m pytest --cov=phalanx --cov-report=xml
          --cov-report=term-missing --tb=short
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.12'
        with:
          token: '${{ secrets.CODECOV_TOKEN }}'
          slug: ajbarea/phalanx-fl
          files: coverage.xml
          fail_ci_if_error: false
          disable_search: true
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: 0.11.5
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra hf --extra torch
      # GHSA-537c-gmf6-5ccf: availability-only OOB read in the OpenSSL bundled in
      # cryptography's wheels (no RCE/data impact), fixed in cryptography 48.0.1 — but
      # flwr 1.31 caps cryptography <48, and phalanx has no direct cryptography use.
      # Drop this ignore when flwr widens its pin.
      # PYSEC-2026-2273 (GHSA-hhrp-gw25-jr43): unsafe deserialization RCE in ray's
      # read_webdataset() reader, fixed in ray 2.56.0 - but flwr 1.31/1.32 pin
      # ray==2.55.1 exactly, and phalanx never calls read_webdataset(). Drop this
      # ignore once flwr ships a release that widens the ray pin.
      # PYSEC-2026-3552 / -3553 / -3554: three cryptography advisories in the X.509
      # and PKCS#7 paths - a Bleichenbacher oracle in EnvelopedData decryption,
      # exponential path-building on duplicate self-signed intermediates, and a
      # wildcard-DNS escape from permittedSubtrees. Fixed in cryptography 49/50, but
      # every published flwr through 1.36 caps cryptography <47.0.0, so no upgrade
      # path exists while phalanx uses Flower. phalanx imports neither x509 nor pkcs7
      # and validates no certificate chains; cryptography arrives only under flwr's
      # gRPC. Drop these when flwr widens its cryptography pin.
      # PYSEC-2026-3716 (CVE-2026-66007): path traversal in datasets' folder-based
      # builders, where file_name metadata can escape the dataset root. Fixed in
      # datasets 5.0.1, but flwr-datasets 0.6.0 (its newest) caps datasets <5.0.0.
      # phalanx loads through flwr_datasets.FederatedDataset from the Hub and uses no
      # folder builder, so the affected reader never runs. Drop this when
      # flwr-datasets widens its datasets pin.
      # Review all five ignores by 2026-12-05.
      - name: Audit for known vulnerabilities
        run: >
          uv run pip-audit
          --ignore-vuln GHSA-537c-gmf6-5ccf
          --ignore-vuln GHSA-hhrp-gw25-jr43
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln PYSEC-2026-3716
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: 0.11.5
          enable-cache: true
      # Dep-light wiring gate: build the Flower app bundle (validates the
      # [tool.flwr] config + components without downloading the model/dataset).
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build the Flower app bundle
        run: uv run flwr build
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

name: CI Pipeline
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.5
          enable-cache: true
      - name: Verify lockfile is in sync with pyproject.toml
        run: uv lock --check
      # ty resolves torch/transformers via allowed-unresolved-imports, so lint
      # needs no model stack — keep it fast with the dev group only.
      - name: Install dev dependencies
        run: uv sync --frozen
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: ty type-check
        run: uv run ty check
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: 'Test (Python ${{ matrix.python-version }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.12'
          - '3.13'
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.5
          enable-cache: true
          cache-suffix: 'py${{ matrix.python-version }}'
      - name: Install dependencies (CPU torch + HF stack)
        run: 'uv sync --frozen --extra hf --extra torch --python ${{ matrix.python-version }}'
      - name: Run tests with coverage
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: >
          uv run python -m pytest --cov=phalanx --cov-report=xml
          --cov-report=term-missing --tb=short
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        if: matrix.python-version == '3.12'
        with:
          token: '${{ secrets.CODECOV_TOKEN }}'
          slug: ajbarea/phalanx-fl
          files: coverage.xml
          fail_ci_if_error: false
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.5
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra hf --extra torch
      - name: Audit for known vulnerabilities
        run: uv run pip-audit
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

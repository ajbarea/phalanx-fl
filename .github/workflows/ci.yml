name: CI Pipeline
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.26
          enable-cache: true
      - name: Verify lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen
      - name: Audit for security vulnerabilities
        run: uv run intellifl-dev audit
      - name: Upload audit logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs
          path: |
            logs/backend-audit.log
            logs/frontend-audit.log
          if-no-files-found: ignore
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
  test:
    name: 'Test (Python ${{ matrix.python-version }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.26
          enable-cache: true
          cache-suffix: 'py${{ matrix.python-version }}'
      - name: Install dependencies
        run: 'uv sync --frozen --python ${{ matrix.python-version }}'
      - name: Run unit tests (parallel)
        run: >
          uv run pytest -n auto --cov=intellifl --cov-append --cov-report=
          tests/unit/ --tb=short
      - name: Run integration tests (serial)
        run: >
          uv run pytest --cov=intellifl --cov-append --cov-report=
          tests/integration/ --tb=short
      - name: Run performance tests (serial)
        run: >
          uv run pytest --cov=intellifl --cov-append --cov-report=
          tests/performance/ --tb=short
      - name: Generate final coverage report
        run: |
          uv run coverage report --show-missing
          uv run coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.11'
        with:
          token: '${{ secrets.CODECOV_TOKEN }}'
          slug: ajbarea/phalanx-fl
          files: tests/logs/coverage.xml
          fail_ci_if_error: true
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.26
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Smoke check developer CLI
        run: uv run intellifl-dev help
      - name: Run smoke tests
        run: |
          uv run python -m tests.scripts.ci_smoke_test
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        if_ci_failed: error

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

ignore:
  - "tests/**"
  - "demo/**"
  - "docs/**"
  - "scripts/**"
  - "frontend/**"
  - "*.md"
  # Developer tooling — invoked via CLI, not part of the FL framework runtime
  - "intellifl/dev_cli.py"
  - "intellifl/dev_runner.py"
  # Visualization / reporting — matplotlib, HTML, animation output; verified via artifact inspection
  - "intellifl/attack_utils/snapshot_image_viz.py"
  - "intellifl/attack_utils/snapshot_html_reports.py"
  - "intellifl/attack_utils/snapshot_animation.py"
  - "intellifl/attack_utils/snapshot_text_viz.py"
  - "intellifl/output_handlers/new_plot_handler.py"
  # Celery task wrappers — thin subprocess shims, exercised by integration runs
  - "intellifl/tasks/**"
  # Terminal/PTY router — interactive shell, not unit-testable in CI
  - "intellifl/api/routers/terminal.py"
